name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fails fast on bad data, before spending a minute on a build.
      - name: Validate content
        run: npm run validate

      # Proves every challenge is still solvable.
      - name: Test engine
        run: npm test

      # nmap lets the practice tasks that scan a port be verified by running
      # the real command, rather than falling back to a recorded sample.
      - name: Install nmap for the practice checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap

      # Proves every practice task is gradeable, and that wrong output is
      # rejected rather than waved through.
      - name: Test practice tasks
        run: npm run test:practice

      - name: Build site
        run: npm run build

      # Needs dist/, so it runs after the build.
      - name: Validate links
        run: npm run validate:links

      # Guards the guard: breaks content on purpose and asserts it is caught.
      - name: Test validator
        run: npm run test:validator

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
