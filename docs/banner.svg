<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Learmux: learn the Linux command line on your phone">
  <title>Learmux</title>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232232"/>
      <stop offset="0.55" stop-color="#1c1b27"/>
      <stop offset="1" stop-color="#16151f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#20d65a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#20d65a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d65a"/>
      <stop offset="1" stop-color="#20d65a" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#field)"/>

    <!-- a faint engineering grid, so the field is not a flat rectangle -->
    <g stroke="#ffffff" stroke-opacity="0.032" stroke-width="1">
      <path d="M0 40h1200M0 80h1200M0 120h1200M0 160h1200M0 200h1200M0 240h1200M0 280h1200"/>
      <path d="M40 0v320M120 0v320M200 0v320M280 0v320M360 0v320M440 0v320M520 0v320M600 0v320M680 0v320M760 0v320M840 0v320M920 0v320M1000 0v320M1080 0v320M1160 0v320"/>
    </g>

    <rect x="0" y="150" width="720" height="170" fill="url(#glow)"/>

    <!-- the mark: a terminal prompt -->
    <g transform="translate(64 74)">
      <rect x="0" y="0" width="60" height="60" rx="13" fill="#20d65a" fill-opacity="0.12" stroke="#20d65a" stroke-width="2.4"/>
      <path d="M17 22l9 8-9 8" stroke="#20d65a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M32 38h13" stroke="#eef1f5" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="144" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.2">
      <tspan fill="#f4f5f7">Lear</tspan><tspan fill="#20d65a">mux</tspan>
    </text>

    <text x="64" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a9a9b6">
      Learn the Linux command line on your phone.
    </text>

    <rect x="64" y="200" width="112" height="3" rx="1.5" fill="url(#rule)"/>

    <text x="64" y="240" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#7f7f8d">
      66 lessons · 12 tracks · 105 tools · 392 terms
    </text>
    <text x="64" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#7f7f8d">
      a real shell in the page, no backend, no account
    </text>

    <!-- a terminal, because that is the whole product -->
    <g transform="translate(724 54)">
      <rect x="0" y="0" width="412" height="212" rx="12" fill="#101419" stroke="#2f2e42" stroke-width="1.5"/>
      <rect x="0" y="0" width="412" height="34" rx="12" fill="#171b22"/>
      <rect x="0" y="22" width="412" height="12" fill="#171b22"/>
      <circle cx="20" cy="17" r="4.2" fill="#3a3a48"/>
      <circle cx="36" cy="17" r="4.2" fill="#3a3a48"/>
      <circle cx="52" cy="17" r="4.2" fill="#3a3a48"/>
      <text x="76" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#6d6d7c">player@termux</text>

      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
        <text x="22" y="64" fill="#20d65a">$</text>
        <text x="40" y="64" fill="#d7dbe2">pwd</text>
        <text x="40" y="86" fill="#8b8b99">/data/data/com.termux/files/home</text>

        <text x="22" y="116" fill="#20d65a">$</text>
        <text x="40" y="116" fill="#d7dbe2">ls</text>
        <text x="40" y="138" fill="#8b8b99">notes.txt  projects</text>

        <text x="22" y="168" fill="#20d65a">$</text>
        <text x="40" y="168" fill="#d7dbe2">grep -c GET access.log</text>
        <text x="40" y="190" fill="#f3bc36">6</text>
      </g>
      <rect x="356" y="52" width="34" height="14" rx="7" fill="#20d65a" fill-opacity="0.14" stroke="#20d65a" stroke-width="1"/>
      <text x="364" y="63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" fill="#20d65a">live</text>
    </g>
  </g>
</svg>
